<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15121d"><title>祁煜 · 私人聊天</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><div class="app">
<header class="header"><div class="avatar">祁</div><div><h1>祁煜 <span class="dot"></span></h1><p>我在，慢慢说。</p></div><span class="local-label">本地模拟</span></header>
<section class="deck-panel" aria-label="本轮牌组"><div class="deck-row"><button id="deck-toggle" aria-expanded="false" aria-controls="deck-details"><span class="deck-title">本轮牌组</span><span class="deck-summary"><span id="spread-name"></span><span id="cards" class="cards"></span></span><span id="chevron">⌄</span></button><button id="redraw" disabled>↻ <span>重新抽牌</span></button></div><div id="deck-details" hidden><div id="detail-cards"></div><p>牌组仅用于对话内部参考。重新解读保留原回复的牌组。</p></div></section>
<main id="conversation" aria-label="与祁煜的对话"><p class="date-label">今晚 · 只属于我们的对话</p><div id="messages" role="log" aria-live="polite" aria-relevant="additions text"></div></main>
<footer class="composer-wrap"><form id="chat-form"><div class="input-row"><label for="message" class="sr-only">发送给祁煜</label><textarea id="message" rows="1" maxlength="1000" placeholder="给祁煜发消息…"></textarea><button id="send" type="submit" aria-label="发送消息" disabled>↑</button></div><div class="tool-row"><div class="tools"><button type="button" id="image-tool" aria-label="图片入口">▧</button><button type="button" id="link-tool" aria-label="链接入口">↗</button><button type="button" id="emoji-tool" aria-label="表情入口" aria-expanded="false">☺</button></div><span>雾雾，想说什么都可以。</span></div><div id="emoji-picker" hidden aria-label="选择表情"><button type="button">🌙</button><button type="button">💜</button><button type="button">🐟</button><button type="button">✨</button><button type="button">🫧</button></div></form></footer>
</div><div id="toast" role="status" hidden></div></body></html>
